name: business_india
description: "Business India — cartoon Indian-themed Monopoly board game."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.3

  # Game engine (board canvas, tokens, sprite animations, particles)
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # UI animation primitives
  flutter_animate: ^4.5.0
  gap: ^3.0.0

  # UI
  flutter_svg: ^2.1.0
  google_fonts: ^6.2.1

  # Formatting (rupee / Indian numbering)
  intl: ^0.19.0

  # Lightweight key-value storage (for settings)
  shared_preferences: ^2.5.3

  # Audio playback
  audioplayers: ^6.1.0

  # Asset bootstrap (download + unzip Kenney-style packs at build time)
  http: ^1.2.0
  archive: ^3.6.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatars/
    - assets/images/
    - assets/images/tiles/
    - assets/images/tokens/
    - assets/images/cards/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/rive/
    - assets/generated/
